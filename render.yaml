version: "1"

services:
  - type: web
    name: cbs-customs-brokerage
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cbs-customs-brokerage.onrender.com
      - key: CBS_ADMIN_PASSWORD
        sync: false